# Where Cucumber finds the step definitions and hooks.
cucumber.glue=stepdefinitions

# Reports: pretty console output plus HTML and JSON (JSON feeds the HTML dashboard).
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json
cucumber.publish.quiet=true

# Run scenarios in parallel so the suite scales to hundreds of tests.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.mode.default=concurrent
