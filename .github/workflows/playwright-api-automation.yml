name: Playwright API Automation

on:
  push:
    paths:
      - "playwright-api-automation/**"
      - ".github/workflows/playwright-api-automation.yml"
  pull_request:
    paths:
      - "playwright-api-automation/**"
      - ".github/workflows/playwright-api-automation.yml"
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker expression to run (e.g. smoke, regression). Empty = all tests."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright-api-automation
    env:
      MARKER: ${{ inputs.marker }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: playwright-api-automation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run API tests
        run: |
          if [ -n "$MARKER" ]; then
            pytest -m "$MARKER"
          else
            pytest
          fi

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-test-reports
          path: playwright-api-automation/reports/
          if-no-files-found: warn
