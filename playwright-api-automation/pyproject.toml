[project]
name = "playwright-api-automation"
version = "1.0.0"
description = "API automation framework built with Playwright for Python and pytest."
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--html=reports/report.html",
    "--self-contained-html",
    "--junitxml=reports/junit.xml",
]
markers = [
    "smoke: critical, fast checks",
    "regression: full functional coverage",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s - %(message)s"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "N", "RUF"]
